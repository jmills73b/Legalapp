# The paragraph library.
#
# This is the asset, not the prompts. On a real deployment these paragraphs are
# harvested from the firm's own precedent bank so the first letter already
# sounds like the firm; what follows is a starter set.
#
# Every paragraph carries provenance: id + version, so any assembled letter can
# answer "why does it say this?".

- id: hdr_refs
  role: heading
  version: 1
  text: |
    [FIRM_NAME]
    [FIRM_ADDRESS_BLOCK]

    Our ref:   [MATTER_REF]
    Your ref:  [THEIR_REF]
    Date:      [LETTER_DATE]

- id: hdr_wp
  role: marking
  version: 1
  text: |
    WITHOUT PREJUDICE

- id: hdr_subject_financial
  role: heading
  version: 1
  text: |
    Dear [RECIPIENT_SALUTATION]

    Re: [CLIENT_FULL_NAME] and [OTHER_PARTY_NAME] -- financial remedy

- id: hdr_subject_children
  role: heading
  version: 1
  text: |
    Dear [RECIPIENT_SALUTATION]

    Re: [CLIENT_FULL_NAME] and [OTHER_PARTY_NAME] -- arrangements for the children

- id: intro_acting
  role: body
  version: 1
  text: >
    We act for [CLIENT_FULL_NAME] and write further to our earlier
    correspondence in this matter.

- id: fin_form_e_outstanding
  role: body
  version: 1
  text: >
    Your client's Form E fell due on [DISCLOSURE_DUE_DATE]. We have not yet
    received it. Our client filed and served hers in accordance with the
    timetable, and we enclose a further copy for convenience.

- id: fin_voluntary_proposal
  role: body
  version: 1
  text: >
    Before either party incurs the cost of an application, we propose a
    voluntary exchange of financial disclosure. Our client is willing to
    complete a Form E and exchange it simultaneously with your client, on a
    date convenient to you both.

- id: fin_disclosure_scope
  role: body
  version: 1
  text: >
    For the avoidance of doubt, we suggest the exchange cover the twelve months
    of statements for each account, the last three payslips or two years of
    accounts, current mortgage and pension statements, and any property
    valuation either party relies on.

- id: req_reply_by_reasoned
  role: body
  version: 1
  text: >
    We would be grateful for your response by [RESPONSE_DEADLINE]. We suggest
    that date so that the parties can keep to the directions timetable and avoid
    the additional cost of an adjournment.

- id: offer_call
  role: body
  version: 1
  text: >
    If there is a difficulty in meeting that date, please telephone the writer.
    We would much rather agree a short extension between us than trouble the
    court with it.

- id: ncdr_invitation
  role: body
  version: 1
  text: >
    We remind both parties of the expectation that non-court dispute resolution
    is considered at each stage. Our client is willing to attend mediation or a
    private financial dispute resolution appointment, and we would welcome your
    client's views.

- id: next_step_directions_neutral
  role: body
  version: 1
  text: >
    If we have not heard from you by that date, our client's instructions are to
    apply to the court for directions. We would prefer to avoid that step and
    the costs it involves, which is why we have set out the position now.

- id: signoff_faithfully
  role: closing
  version: 1
  text: |
    Yours faithfully

    [FEE_EARNER_NAME]
    [FEE_EARNER_ROLE]
    [FIRM_NAME]

- id: enc_form_e
  role: enclosure
  version: 1
  text: |
    Enc: Form E of [CLIENT_FULL_NAME]

# --- correspondence to an unrepresented person -------------------------------
# The highest tone risk in the catalogue. The register changes completely:
# plain language, a longer deadline, no advice, and an explicit steer to get
# their own solicitor.

- id: hdr_subject_lip
  role: heading
  version: 1
  text: |
    Dear [OTHER_PARTY_NAME]

    Re: arrangements following your separation from [CLIENT_FULL_NAME]

- id: lip_who_we_are
  role: body
  version: 1
  text: >
    We are solicitors and we act for [CLIENT_FULL_NAME]. We are writing to you
    directly because we understand you do not have a solicitor at the moment. We
    appreciate that receiving a letter from a firm of solicitors can be
    unsettling, and we want to explain plainly why we are writing.

- id: lip_purpose
  role: body
  version: 1
  text: >
    Our client would like to reach an agreement with you about the practical
    arrangements that need to be settled between you. Nothing has been decided,
    and this letter is not a court document. It is an invitation to talk.

- id: lip_own_advice
  role: body
  version: 1
  text: >
    Before you reply, we would encourage you to speak to your own solicitor. We
    act for [CLIENT_FULL_NAME] and cannot advise you, so it is important that you
    have someone advising you on your own position. You can find a family
    solicitor near you through Resolution or the Law Society, and free initial
    guidance is available from Citizens Advice.

- id: lip_reply_when_ready
  role: body
  version: 1
  text: >
    There is no rush. We suggest you reply by [RESPONSE_DEADLINE], which we hope
    gives you enough time to take advice first. If you need longer, please let us
    know and we will agree a later date with you.

- id: lip_no_threat_close
  role: body
  version: 1
  text: >
    If we do not hear from you, our client may need to ask the court to help the
    two of you resolve matters. We would much rather reach an agreement between
    you, which is usually quicker and less expensive for both of you.

# --- correspondence to our own client ----------------------------------------
# Contains advice, so it always takes the reviewed path, and it carries the
# costs-information duty under the SRA Transparency Rules.

- id: hdr_subject_client
  role: heading
  version: 1
  text: |
    Dear [CLIENT_SALUTATION]

    Re: your matter -- hearing on [HEARING_DATE]

- id: client_hearing_outcome
  role: body
  version: 1
  text: >
    I am writing to confirm what happened at the hearing and what happens next. I
    have set out the orders that were made below, together with the dates you
    need to keep in mind.

- id: client_next_steps
  role: body
  version: 1
  text: >
    The next step is for us to prepare the documents the court has asked for. I
    will send you a list of what I need from you separately, and I would be
    grateful if you could let me have those items by [RESPONSE_DEADLINE].

- id: client_costs_update
  role: body
  version: 1
  text: >
    As we agreed at the outset, I will keep you updated on costs. I will send you
    an updated estimate with my next letter. If at any point you would like a
    costs position before then, please just ask and I will provide one.

- id: signoff_sincerely
  role: closing
  version: 1
  text: |
    Yours sincerely

    [FEE_EARNER_NAME]
    [FEE_EARNER_ROLE]
    [FIRM_NAME]
