# The paragraph library.
#
# This is the asset, not the prompts. On a real deployment these paragraphs are
# harvested from the firm's own precedent bank so the first letter already
# sounds like the firm; what follows is a starter set.
#
# Every paragraph carries provenance: id + version, so any assembled letter can
# answer "why does it say this?".

- id: hdr_refs
  role: heading
  version: 1
  text: |
    [FIRM_NAME]
    [FIRM_ADDRESS_BLOCK]

    Our ref:   [MATTER_REF]
    Your ref:  [THEIR_REF]
    Date:      [LETTER_DATE]

- id: hdr_wp
  role: marking
  version: 1
  text: |
    WITHOUT PREJUDICE

- id: hdr_subject_financial
  role: heading
  version: 1
  text: |
    Dear [RECIPIENT_SALUTATION]

    Re: [CLIENT_FULL_NAME] and [OTHER_PARTY_NAME] -- financial remedy

- id: hdr_subject_children
  role: heading
  version: 1
  text: |
    Dear [RECIPIENT_SALUTATION]

    Re: [CLIENT_FULL_NAME] and [OTHER_PARTY_NAME] -- arrangements for the children

- id: intro_acting
  role: body
  version: 1
  text: >
    We act for [CLIENT_FULL_NAME] and write further to our earlier
    correspondence in this matter.

- id: fin_form_e_outstanding
  role: body
  version: 1
  text: >
    Your client's Form E fell due on [DISCLOSURE_DUE_DATE]. We have not yet
    received it. Our client filed and served hers in accordance with the
    timetable, and we enclose a further copy for convenience.

- id: fin_voluntary_proposal
  role: body
  version: 1
  text: >
    Before either party incurs the cost of an application, we propose a
    voluntary exchange of financial disclosure. Our client is willing to
    complete a Form E and exchange it simultaneously with your client, on a
    date convenient to you both.

- id: fin_disclosure_scope
  role: body
  version: 1
  text: >
    For the avoidance of doubt, we suggest the exchange cover the twelve months
    of statements for each account, the last three payslips or two years of
    accounts, current mortgage and pension statements, and any property
    valuation either party relies on.

- id: req_reply_by_reasoned
  role: body
  version: 1
  text: >
    We would be grateful for your response by [RESPONSE_DEADLINE]. We suggest
    that date so that the parties can keep to the directions timetable and avoid
    the additional cost of an adjournment.

- id: offer_call
  role: body
  version: 1
  text: >
    If there is a difficulty in meeting that date, please telephone the writer.
    We would much rather agree a short extension between us than trouble the
    court with it.

- id: ncdr_invitation
  role: body
  version: 1
  text: >
    We remind both parties of the expectation that non-court dispute resolution
    is considered at each stage. Our client is willing to attend mediation or a
    private financial dispute resolution appointment, and we would welcome your
    client's views.

- id: next_step_directions_neutral
  role: body
  version: 1
  text: >
    If we have not heard from you by that date, our client's instructions are to
    apply to the court for directions. We would prefer to avoid that step and
    the costs it involves, which is why we have set out the position now.

- id: signoff_faithfully
  role: closing
  version: 1
  text: |
    Yours faithfully

    [FEE_EARNER_NAME]
    [FEE_EARNER_ROLE]
    [FIRM_NAME]

- id: enc_form_e
  role: enclosure
  version: 1
  text: |
    Enc: Form E of [CLIENT_FULL_NAME]

# --- correspondence to an unrepresented person -------------------------------
# The highest tone risk in the catalogue. The register changes completely:
# plain language, a longer deadline, no advice, and an explicit steer to get
# their own solicitor.

- id: hdr_subject_lip
  role: heading
  version: 1
  text: |
    Dear [OTHER_PARTY_NAME]

    Re: arrangements following your separation from [CLIENT_FULL_NAME]

- id: lip_who_we_are
  role: body
  version: 1
  text: >
    We are solicitors and we act for [CLIENT_FULL_NAME]. We are writing to you
    directly because we understand you do not have a solicitor at the moment. We
    appreciate that receiving a letter from a firm of solicitors can be
    unsettling, and we want to explain plainly why we are writing.

- id: lip_purpose
  role: body
  version: 1
  text: >
    Our client would like to reach an agreement with you about the practical
    arrangements that need to be settled between you. Nothing has been decided,
    and this letter is not a court document. It is an invitation to talk.

- id: lip_own_advice
  role: body
  version: 1
  text: >
    Before you reply, we would encourage you to speak to your own solicitor. We
    act for [CLIENT_FULL_NAME] and cannot advise you, so it is important that you
    have someone advising you on your own position. You can find a family
    solicitor near you through Resolution or the Law Society, and free initial
    guidance is available from Citizens Advice.

- id: lip_reply_when_ready
  role: body
  version: 1
  text: >
    There is no rush. We suggest you reply by [RESPONSE_DEADLINE], which we hope
    gives you enough time to take advice first. If you need longer, please let us
    know and we will agree a later date with you.

- id: lip_no_threat_close
  role: body
  version: 1
  text: >
    If we do not hear from you, our client may need to ask the court to help the
    two of you resolve matters. We would much rather reach an agreement between
    you, which is usually quicker and less expensive for both of you.

# --- correspondence to our own client ----------------------------------------
# Contains advice, so it always takes the reviewed path, and it carries the
# costs-information duty under the SRA Transparency Rules.

- id: hdr_subject_client
  role: heading
  version: 1
  text: |
    Dear [CLIENT_SALUTATION]

    Re: your matter -- hearing on [HEARING_DATE]

- id: client_hearing_outcome
  role: body
  version: 1
  text: >
    I am writing to confirm what happened at the hearing and what happens next. I
    have set out the orders that were made below, together with the dates you
    need to keep in mind.

- id: client_next_steps
  role: body
  version: 1
  text: >
    The next step is for us to prepare the documents the court has asked for. I
    will send you a list of what I need from you separately, and I would be
    grateful if you could let me have those items by [RESPONSE_DEADLINE].

- id: client_costs_update
  role: body
  version: 1
  text: >
    As we agreed at the outset, I will keep you updated on costs. I will send you
    an updated estimate with my next letter. If at any point you would like a
    costs position before then, please just ask and I will provide one.

- id: signoff_sincerely
  role: closing
  version: 1
  text: |
    Yours sincerely

    [FEE_EARNER_NAME]
    [FEE_EARNER_ROLE]
    [FIRM_NAME]

# --- client care -------------------------------------------------------------
# Carries duties under the SRA Codes: what we are doing, who is doing it, what
# it will cost, and how to complain. Each is its own paragraph so the structure
# check can require it by name.

- id: hdr_subject_client_care
  role: heading
  version: 1
  text: |
    Dear [CLIENT_SALUTATION]

    Re: your family matter -- confirming our advice and our terms

- id: cc_scope
  role: body
  version: 1
  text: >
    Thank you for meeting me. I am writing to confirm what you have asked us to
    do and what you can expect from us. We have agreed that we will advise you
    on the matters we discussed and correspond on your behalf. If the work
    changes, I will write to you again before we go any further.

- id: cc_who_is_handling
  role: body
  version: 1
  text: >
    I will be handling your matter day to day. My role is [FEE_EARNER_ROLE], and
    my supervisor is [SUPERVISOR_NAME]. If you cannot reach me and the matter is
    urgent, please ask for my supervisor.

- id: cc_costs_basis
  role: body
  version: 1
  text: >
    Our charges are based on the time we spend on your matter, at the rate set
    out in the enclosed terms of business. I will give you a written estimate for
    each stage before we begin it, and I will tell you promptly if an estimate
    needs to change. You will not receive a bill for work you have not been told
    about first.

- id: cc_complaints
  role: body
  version: 1
  text: >
    If you are ever unhappy with our service or with a bill, please tell me
    first, as most concerns can be resolved quickly. If we cannot resolve it, our
    written complaints procedure is enclosed and explains how to escalate the
    matter within the firm. You also have the right to complain to the Legal
    Ombudsman, and the enclosed procedure explains the time limits that apply.

- id: cc_next_step
  role: body
  version: 1
  text: >
    Please read the enclosed terms of business and let me have a signed copy by
    [RESPONSE_DEADLINE]. If anything in this letter does not match your
    understanding of what we agreed, please tell me straight away.

- id: enc_client_care
  role: enclosure
  version: 1
  text: |
    Enc: Terms of business; complaints procedure

# --- opening correspondence with the other side's solicitors -----------------

- id: hdr_subject_general
  role: heading
  version: 1
  text: |
    Dear [RECIPIENT_SALUTATION]

    Re: [CLIENT_FULL_NAME] and [OTHER_PARTY_NAME]

- id: fl_confirm_instructed
  role: body
  version: 1
  text: >
    We understand that you act for [OTHER_PARTY_NAME]. Please confirm that this
    is so and that you are instructed to accept correspondence, in which case we
    will write to you rather than to your client from now on.

- id: fl_constructive_opening
  role: body
  version: 1
  text: >
    Our client would like matters resolved as constructively as possible. We
    have advised her about the options available, and she is willing to consider
    any sensible proposal your client wishes to put forward.

# --- non-court dispute resolution --------------------------------------------

- id: ncdr_why_now
  role: body
  version: 1
  text: >
    Both parties are expected to consider non-court dispute resolution at every
    stage, and the court will ask what has been considered. We think it is worth
    the two of them exploring this now, while positions are not yet entrenched
    and before either party has spent significantly on costs.

- id: ncdr_options
  role: body
  version: 1
  text: >
    The options that may suit this matter include mediation, negotiation between
    solicitors, a collaborative process, arbitration, or a private financial
    dispute resolution appointment. Our client has no fixed view about which is
    best and is willing to discuss any of them.

- id: ncdr_proposal_next
  role: body
  version: 1
  text: >
    We propose that both parties agree an approach in principle, and that we then
    put forward two or three names between us. Our client will meet her share of
    the cost of whichever route is agreed.

- id: fm5_purpose
  role: body
  version: 1
  text: >
    Each party is required to set out their views on using non-court dispute
    resolution in advance of the hearing. We write so that our respective clients
    can file consistent information and so that neither is taken by surprise.

- id: fm5_our_position
  role: body
  version: 1
  text: >
    Our client's position is that non-court dispute resolution remains suitable
    in this matter and that she is willing to engage in it. We will record that
    view, together with any steps already taken.

- id: fm5_invite_position
  role: body
  version: 1
  text: >
    Please let us have your client's position so that we can each complete our
    forms accurately. If your client takes a different view, it would be helpful
    to understand why, in case there is something we can address between us.

# --- children ----------------------------------------------------------------

- id: ca_current_position
  role: body
  version: 1
  text: >
    We understand the arrangements for the children have been difficult to settle
    since the separation. Our client would like to agree something workable that
    the children can rely on, rather than have arrangements decided for them.

- id: ca_proposal
  role: body
  version: 1
  text: >
    Our client proposes the arrangements set out below. She has tried to build
    them around the children's school week and their activities rather than
    around what is convenient for either parent, and she is open to adjusting
    them if your client sees a difficulty we have missed.

- id: ca_open_to_discussion
  role: body
  version: 1
  text: >
    This proposal is made in an effort to reach agreement and is not intended as
    a final position. If your client would like to suggest an alternative
    pattern, we will put it to our client constructively.

# --- enclosing an order ------------------------------------------------------

- id: hdr_subject_order
  role: heading
  version: 1
  text: |
    Dear [CLIENT_SALUTATION]

    Re: your matter -- the order made on [HEARING_DATE]

- id: ord_enclosing
  role: body
  version: 1
  text: >
    I enclose a sealed copy of the order. Please keep it somewhere safe, as you
    may need to produce it later. I have set out below what it means in practice,
    but please do read the order itself as well.

- id: ord_effect_explained
  role: body
  version: 1
  text: >
    In summary, the order records what has been agreed or decided and sets out
    the dates by which each of you must do something. Where the order says a step
    must be taken by a particular date, that date is binding and the court
    expects it to be met.

- id: ord_what_you_must_do
  role: body
  version: 1
  text: >
    The steps that fall to you are listed below with their dates. If you think
    you may not be able to meet one of them, please tell me as soon as you can,
    because it is usually possible to agree an extension in advance and much
    harder to explain a missed date afterwards.

- id: ord_ask_questions
  role: body
  version: 1
  text: >
    Please do not worry if any of this is unclear. Orders are written for the
    court rather than for the people they affect, and it is completely normal to
    need it explained. Telephone me and I will go through it with you.

- id: enc_sealed_order
  role: enclosure
  version: 1
  text: |
    Enc: Sealed order

# =============================================================================
# Optional paragraphs. These are what a fee earner picks from instead of
# writing the middle of the letter from scratch.
# =============================================================================

# --- chasing disclosure: escalation ------------------------------------------

- id: fin_second_chase
  role: body
  version: 1
  text: >
    We wrote to you on [PREVIOUS_LETTER_DATE] about your client's outstanding
    Form E and have not had a reply. We appreciate that things are missed, so we
    are writing again before taking any other step.

- id: fin_final_before_application
  role: body
  version: 1
  text: >
    We have now written twice about your client's outstanding Form E, most
    recently on [PREVIOUS_LETTER_DATE], without a substantive reply. We would
    still prefer to resolve this between us, but we must tell you that our
    client cannot let the timetable slip further.

- id: fin_partial_disclosure
  role: body
  version: 1
  text: >
    We acknowledge the documents your client has provided. The items still
    outstanding are listed below. If any of them do not exist or are not
    available, please say so and we will not press for them.

- id: fin_costs_reserved
  role: body
  version: 1
  text: >
    We do not raise costs lightly, and our client's wish is to resolve matters
    without any costs argument. We should record, however, that if an
    application becomes necessary solely because disclosure was not provided,
    our client reserves her position on the costs of that application.

- id: fin_offer_extension
  role: body
  version: 1
  text: >
    If your client needs more time, we would rather agree it now than have the
    date pass. Please tell us what is realistic and we will take instructions
    on a revised date.

- id: fin_questionnaire_note
  role: body
  version: 1
  text: >
    Once we have your client's Form E we will raise any questions arising from
    it in the usual way. We will keep those questions proportionate to the
    issues actually in dispute.

# --- opening correspondence: what the matter is about ------------------------

- id: scope_children_only
  role: body
  version: 1
  text: >
    This matter concerns the arrangements for the children only. Our client is
    not asking us to raise financial matters at this stage, and would prefer the
    two issues be kept separate so that neither delays the other.

- id: scope_financial_only
  role: body
  version: 1
  text: >
    This matter concerns the financial arrangements only. We understand the
    arrangements for the children are working, and our client does not wish to
    reopen them.

- id: scope_both
  role: body
  version: 1
  text: >
    There are two matters to resolve: the arrangements for the children and the
    financial arrangements. Our client would like to deal with the children
    first, as those arrangements affect the family day to day.

- id: fl_no_proceedings_yet
  role: body
  version: 1
  text: >
    No proceedings have been issued and our client does not want to issue if it
    can be avoided. This letter is intended to open a conversation rather than
    to set a deadline for its own sake.

- id: fl_urgency_note
  role: body
  version: 1
  text: >
    We should explain why we have written now rather than later. There is a
    practical deadline approaching that affects both parties, and our client
    would rather address it jointly than have it resolved for them.

# --- non-court dispute resolution: the specific route ------------------------

- id: ncdr_mediation_detail
  role: body
  version: 1
  text: >
    Our client's preference is mediation. A mediator does not take sides or
    impose a decision; they help the parties reach their own agreement, and
    anything agreed can then be recorded properly. Our client is willing to
    attend an initial meeting and to meet her share of the cost.

- id: ncdr_private_fdr_detail
  role: body
  version: 1
  text: >
    Our client would be willing to fund her share of a private financial dispute
    resolution appointment. It is usually quicker to arrange than a court date
    and gives both parties an experienced view of the likely outcome, which is
    often what unlocks a settlement.

- id: ncdr_arbitration_detail
  role: body
  version: 1
  text: >
    If the parties cannot agree, arbitration is worth considering. It produces a
    binding decision, on a timetable the parties control rather than the court's,
    and it keeps the matter private.

- id: ncdr_solicitor_negotiation
  role: body
  version: 1
  text: >
    If neither party wants a third party involved at this stage, we are content
    to try to narrow the issues in correspondence first. We suggest we exchange
    positions on the two or three points that actually divide the parties rather
    than restating everything.

- id: ncdr_previously_attempted
  role: body
  version: 1
  text: >
    We recognise that an attempt has already been made and did not succeed. Our
    client's view is that the position has moved since then and that a further
    attempt is worthwhile. If your client disagrees, it would help to know why.

- id: ncdr_exemption_note
  role: body
  version: 1
  text: >
    We understand your client may say an exemption applies. If that is right,
    please tell us which one, so that we can advise our client properly rather
    than assume a refusal to engage.

# --- children: the shape of the proposal -------------------------------------

- id: ca_school_week
  role: body
  version: 1
  text: >
    During term time our client proposes the pattern set out below. It is built
    around the school run and the children's usual activities, so that neither
    child has to give anything up because of the arrangement.

- id: ca_holidays
  role: body
  version: 1
  text: >
    For school holidays, our client proposes that the time is divided broadly
    equally, with dates agreed a term in advance so that both parents can book
    time off and neither is left arranging things at short notice.

- id: ca_handovers
  role: body
  version: 1
  text: >
    On handovers, our client suggests they take place at school wherever the
    timing allows, so that the children move from one parent to the other
    without a doorstep exchange.

- id: ca_special_occasions
  role: body
  version: 1
  text: >
    For birthdays, Christmas and other occasions that matter to this family, our
    client proposes the parties alternate year to year and confirm the coming
    year's arrangements each September.

- id: ca_interim_only
  role: body
  version: 1
  text: >
    Our client puts this forward as an interim arrangement only, to give the
    children something settled while the longer-term position is worked out. She
    does not intend it to fix the position permanently.

- id: ca_build_up
  role: body
  version: 1
  text: >
    Our client suggests the time builds up in stages rather than changing all at
    once, so that the children adjust at their own pace and both parents can see
    how each stage is working before the next.

- id: ca_children_views
  role: body
  version: 1
  text: >
    The children are old enough to have a view, and our client's instinct is
    that any arrangement is more likely to hold if it takes account of what they
    would prefer. She is not suggesting they be asked to choose between their
    parents.

# --- unrepresented recipient: additions in the same plain register -----------

- id: lip_children_context
  role: body
  version: 1
  text: >
    Our client would like to agree the arrangements for the children with you.
    She is not asking a court to decide anything at the moment, and she would
    prefer the two of you settled it between you.

- id: lip_financial_context
  role: body
  version: 1
  text: >
    Our client would like to sort out the financial side. That normally starts
    with both of you setting out what you have, so that any discussion is based
    on the same information.

- id: lip_what_happens_next
  role: body
  version: 1
  text: >
    If you would like to reply yourself, you can. If you would prefer a
    solicitor to reply for you, please give them this letter and ask them to
    contact us. Either is fine.

- id: lip_no_reply_needed_today
  role: body
  version: 1
  text: >
    You do not need to decide anything today. If it is easier, you can simply
    reply to say you have received this letter and that you are taking advice.

# --- client letters ----------------------------------------------------------

- id: cc_funding_private
  role: body
  version: 1
  text: >
    You are funding this matter privately. That means you are responsible for
    our charges whatever the outcome, and in family cases the general position
    is that each party meets their own costs.

- id: cc_funding_fixed_fee
  role: body
  version: 1
  text: >
    We have agreed a fixed fee for the work described above. That fee covers
    what is set out in this letter and nothing further. If the matter goes
    beyond it, I will tell you before any additional work is done and we will
    agree the basis for it.

- id: cc_data_protection
  role: body
  version: 1
  text: >
    We hold your information securely and use it only to act for you. Our
    privacy notice is enclosed and explains what we hold, why, and how long we
    keep it.

- id: client_what_i_need
  role: body
  version: 1
  text: >
    There are a few things I need from you before the next stage. I have listed
    them below. If any of them is difficult to obtain, please tell me early
    rather than close to the deadline, as there is usually something we can do
    about it if we know in time.

- id: client_reassurance
  role: body
  version: 1
  text: >
    I know this stage can feel slow and it is normal to find it frustrating.
    Please do telephone me if you would like to talk anything through; it is
    usually quicker than an exchange of emails.

- id: client_costs_estimate_update
  role: body
  version: 1
  text: >
    My estimate for the next stage is set out below. It assumes matters proceed
    as expected. If anything happens that would take us materially beyond it, I
    will write to you before the work is done.

- id: ord_consent_note
  role: body
  version: 1
  text: >
    This order records what the two of you agreed rather than a decision imposed
    on either of you. It is no less binding for that, and the court expects it
    to be complied with in the same way.

- id: ord_deadline_list
  role: body
  version: 1
  text: >
    The dates in the order are listed below. Please put them in your diary now.
    If a date falls on a weekend or a bank holiday it still stands, so it is
    safer to work to the day before.
