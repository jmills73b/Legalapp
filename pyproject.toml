[project]
name = "legalapp"
version = "0.1.0"
description = "Drafting assistant for family law correspondence (England & Wales)"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
agents = ["anthropic>=1.0", "pydantic>=2.0"]
dev = ["pytest>=7.0"]

[project.scripts]
legalapp = "legalapp.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["legalapp*"]

[tool.setuptools.package-data]
legalapp = ["library/*.yaml", "library/lexicons/*.yaml"]
